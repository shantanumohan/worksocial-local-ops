function demandView(){let content='';if(ui.demandTab==='opportunities'){content=`<div class="surface table-wrap"><table class="table"><thead><tr><th>Topic & intent</th><th>Signal</th><th>Pattern</th><th>Evidence</th><th>Mapped asset</th><th></th></tr></thead><tbody>${SIGNALS.map(d=>`<tr><td><button class="row-button" data-action="signal" data-id="${d.id}"><div class="name">${d.name}</div><div class="sub">${d.intent}</div></button></td><td><strong class="${d.evidence==='Hypothesis'?'muted':'green-text'}">${d.delta}</strong><div class="sub">${d.sample}</div></td><td><div style="width:88px;height:27px">${spark(d.trend)}</div></td><td>${badge(d.evidence,d.evidence==='Hypothesis'?'amber':'green')}<div class="sub">${d.source}</div></td><td>${d.page}</td><td>${button('Explore','signal','small','arrow','data-id="'+d.id+'"')}</td></tr>`).join('')}</tbody></table></div>`;}else if(ui.demandTab==='questions'){content=`<div class="grid-2">${SIGNALS.map((d,i)=>`<section class="surface panel"><div class="row between"><span class="mono muted">QUESTION / ${String(i+1).padStart(2,'0')}</span>${badge(i===4?'Hypothesis':'Sample evidence',i===4?'amber':'green')}</div><h3 class="gap18" style="font-size:17px;line-height:1.45">${d.question}</h3><p class="gap8" style="font-size:11px">${d.source} &middot; ${d.sample}. No private customer messages are exposed.</p><div class="row between gap18"><span class="pill">${d.intent}</span>${button('Create answer brief','brief-signal','small','plus','data-id="'+d.id+'"')}</div></section>`).join('')}</div>`;}else if(ui.demandTab==='rankings'){content=`${note('Compare like with like. Average position, a local result observation and an AI citation are separate measures. All values below are illustrative.')}<div class="surface table-wrap gap18"><table class="table"><thead><tr><th>Query</th><th>Surface</th><th>Geography / device</th><th>Current</th><th>Previous</th><th>Window</th></tr></thead><tbody>${[['conference room jersey city','Organic result sample', function presenceView(){return pageHead('DISCOVERY / LOCAL & AI','Be accurately represented. Everywhere.','Keep legitimate profiles, useful local updates and AI visibility connected to verified facts.',button('Profile checklist','presence-checklist','','checkcircle')+button('Create local update','new-draft','primary','plus'))+tabs('presence',[['profiles','Business profiles'],['reviews','Reputation'],['ai','AI presence']],ui.presenceTab)+(ui.presenceTab==='profiles'?`<div class="grid-3">${[['Google Business Profile','Jersey City / illustrative location','Sample ready','Local updates, profile information and approved review responses.','gbp','pin'],['Bing / Apple / directories','Each actual location must be verified','Capability check','Use only supported listing formats. A city keyword does not establish a business location.','directory','globe'],['ChatGPT business presence','Eligibility and verification not established','Manual verification','Separate profile-management tasks from AI-answer observations and private conversations.','chatgpt','sparkle']].map(v=>`<section class="surface listing-card"><div class="row between"><div class="listing-icon">${ic(v[5],21)}</div>${badge(v[2],v[4]==='gbp'?'green':'amber')}</div><h3>${v[0]}</h3><p>${v[1]}</p><div class="divider"></div><p style="min-height:70px">${v[3]}</p><div class="gap18">${button('Review capabilities','connection','','arrow','data-id="'+v[4]+'"')}</div></section>`).join('')}</div><section class="surface panel gap18"><div class="section-head"><h3>Location consistency</h3><span class="mono muted">SOURCE-LED, NOT SCRAPED ASSUMPTIONS</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Field</th><th>Source of truth</th><th>State</th><th>Agent</th></tr></thead><tbody>${[['Business identity','Owner-verified location record','Demo approved','A02 + A17'],['Address & operating hours','Approved property record','Verification required','A17'],['Room capacity','Owner-approved space configuration','Conflict protected','A02'],['Current offer & price','Authoritative booking / price source','Not connected','A15'],['Profile media','Rights-checked venue library','Media review required','A14']].map(r=>`<tr><td class="name">${r[0]}</td><td>${r[1]}</td><td>${badge(r[2],statusType(r[2]))}</td><td class="mono">${r[3]}</td></tr>`).join('')}</tbody></table></div></section>`:ui.presenceTab==='reviews'?`<div class="grid-2"><section class="surface panel"><div class="row between"><h3>Review response workspace</h3>${badge('Synthetic example')}</div><div class="notice gap18">${ic('message')}<span>Demo feedback: "The meeting went well, but I was unsure how to find the entrance."</span></div><p class="gap18" style="font-size:12px;line-height:1.8">Acknowledge the experience, avoid private details and offer a useful next step. A public response must not reveal booking or customer information.</p><div class="gap18">${button('Draft a response','review-response','','edit')}</div></section><section class="surface panel"><h3>Reputation boundaries</h3><div class="gap18">${kv('Authentic reviews only','Required')}${kv('Ordinary response authority','Standing grant')}${kv('Disputes / compensation','Human decision')}${kv('Fake reviews / incentives','Not permitted')}</div></section></div>`:`${note('AI citations, business-profile insights and customer inboxes are different data surfaces. Only display capabilities verified for the connected account.')}<div class="grid-2 gap18"><section class="surface panel"><h3>Profile verification checklist</h3><div class="gap18">${[['Confirm business eligibility','Unverified'],['Verify authorized ownership','Not connected'],['Review business facts','Needs review'],['Discover available insights','Unavailable'],['Establish supported update path','Not assumed']].map((v,i)=>`<div class="keyvalue"><dt>${i+1}. ${v[0]}</dt><dd>${badge(v[1],statusType(v[1]))}</dd></div>`).join('')}</div><div class="gap18">${button('Open setup task','connection','','arrow','data-id="chatgpt function workspaceView(){let body='';if(ui.workspaceTab==='folders'){body=`<div class="grid-2"><section class="surface panel"><h3>Your files. Your workspace.</h3><p class="gap8" style="font-size:11px;line-height:1.8">Save planned paths here. A browser preview cannot create or validate folders on your computer.</p><div class="divider"></div>${[['workspace','Source workspace'],['content','Content output'],['evidence','Evidence & reports'],['backups','Encrypted backup destination']].map(v=>`<div class="field"><label for="path-${v[0]}">${v[1]}</label><input class="path-input" id="path-${v[0]}" value="${esc(S.settings[v[0]])}"></div>`).join('')}${button('Save planned paths','save-paths','primary','check')}</section><section class="surface panel"><h3>Keep the right things separate.</h3><div class="gap18">${[['Working artifacts','Owner-selected output folders'],['Active database','Persistent, non-sync local storage'],['Credentials & browser sessions','Protected local credential broker'],['Backups','Consistent snapshot + encrypted exports']].map(v=>`<div class="step-box"><span class="step-number">${ic('folder',13)}</span><div><h4>${v[0]}</h4><p>${v[1]}</p></div></div>`).join('')}</div>${note('Do not store live database files or authentication state in consumer file-sync folders.','','shield')}</section></div>`;}else if(ui.workspaceTab==='autonomy'){body=`<div class="grid-2"><section class="surface panel"><div class="section-head"><h3>Standing permissions</h3>${badge('Prototype settings')}</div>${toggleRow('Routine content publication','Approved categories, current facts and exact revision only.','policy-publish',S.settings.standingPublish)}${toggleRow('Bounded low-risk repair','Known defect classes; independent tests; at most two attempts.','policy-repair',S.settings.standingRepair)}${toggleRow('Routine concierge responses','Supported answers and lead handoffs, not commitments.','policy-replies',S.settings.standingReplies)}<div class="divider"></div>${note('Changing authority is an owner action. Agents cannot grant it to themselves.','','shield')}</section><section class="surface panel"><h3>Always outside routine authority</h3><div class="gap18">${['Prices, capacity and business addresses','Payments, refunds and contractual commitments','Credentials, permissions and release gates','Broad CRM changes or customer-data exports'].map(v=>`<div class="activity-row">${ic('lock',15)}<span>${v}</span></div>`).join('')}</div><div class="gap18">${button('Review outbound stop','emergency','danger','stop')}</div></section></div>`;}else if(ui.workspaceTab==='care'){body=`<div class="grid-2"><section class="surface panel"><h3>After-hours coverage</h3><p class="gap8" style="font-size:11px">Design settings only. No real schedule is activated.</p><div class="divider"></div><div class="field-grid"><div class="field"><label for="care-start">Coverage begins</label><input id="care-start" type="time" value="${S.settings.careStart}"></div><div class="field"><label for="care-end">Coverage ends</label><input id="care-end" type="time" value="${S.settings.careEnd}"></div></div><div class="field gap18"><label for="care-timezone">Business timezone</label><select id="care-timezone"><option>America/New_York</option></select><small>Cross-midnight windows and daylight saving must be resolved by the local scheduler.</small></div>${button('Save coverage policy','save-care','primary','check')}</section><section class="surface panel"><h3>Handoff, not a dead end.</h3><p class="gap12" style="font-size:12px;line-height:1.8">Unknown inventory, disputes, payment requests and access emergencies need a person. The user can request human help at any point.</p><div class="gap18">${kv('Handoff owner','WorkSocial team / demo')}${kv('Response promise','No unstaffed guarantee')}${kv('Host unavailable','Use existing hosted contact path')}${kv('Human takeover','Cancel queued agent replies')}</div>${button('Preview morning brief','brief','','file')}</section></div>`;}else if(ui.workspaceTab==='design'){body=designContent();}else{body=`<div class="policy-grid"><section class="surface panel"><div class="section-head"><h3>Operating mode</h3>${badge(S.mode,statusType(S.mode))}</div><p style="font-size:11px;margin-bottom:17px">The owner chooses the level of authority. Controls below affect only this prototype.</p><div class="stack">${[['observe','Observe','Read, research and draft. No external writes.','eye'],['operate','Operate','Execute within standing permissions and release checks.','play'],['maintenance','Maintenance','Pause external effects while diagnosing or upgrading.','settings']].map(v=>`<button class="choice ${S.mode===v[0]?'selected':''}" data-action="set-mode" data-id="${v[0]}">${ic(v[3])}<div><h4>${v[1]}</h4><p>${v[2]}</p></div>${S.mode===v[0]?'<span style="margin-left:auto">'+ic('check',16)+'</span>':''}</button>`).join('')}</div><div class="divider"></div>${toggleRow('Local host online','Simulate an offline host to inspect stale-data and blocked-action states.','toggle-host',S.hostOnline)}${toggleRow('New work enabled','Pausing preserves evidence and existing task state.','pause-operations',!S.paused)}</section><section class="surface panel"><div class="section-head"><h3>Resources & workspace</h3>${ic('laptop',18)}</div><div class="field-grid"><div class="field"><label for="concurrency">Concurrent Claude jobs</label><input id="concurrency" type="number" min="1" max="8" value="${S.settings.concurrency}"><small>Reserve capacity for customer response.</small></div><div class="field"><label for="daily-budget">Illustrative daily cap ($)</label><input id="daily-budget" type="number" min="1" max="500" value="${S.settings.budget}"><small>Not connected to account billing.</small></div></div><div class="gap18">${button('Save resource limits','save-resources','','check')}</div><div class="divider"></div>${kv('Reasoning engine','Claude Code / local workers')}${kv('UI environment','Standalone HTML prototype')}${kv('State storage',persistAvailable?'This browser / localStorage':'Memory only / storage blocked')}${kv('External effects','None')}<div class="row wrap gap18">${button('Run setup walkthrough','setup','','laptop')}${button('Export demo state','export-state','','download')}</div><div class="divider"></div><button class="link-btn red-text" data-action="reset-demo">Reset only this prototype</button></section></div>`;}

function designContent(){return`<div class="grid-2"><section class="surface panel"><div class="eyebrow">HOOKED / A USEFUL RETURN LOOP</div><h3>Return for clarity, not another notification.</h3><div class="gap18">${[['Trigger','A meaningful incident, new demand or a useful daily brief.'],['Action','One visible next step, with context and a sensible default.'],['Reward','Verified resolution or new knowledge. No artificial streaks.'],['Investment','Save a fact, policy or reusable view that improves future work.']].map((v,i)=>`<div class="step-box"><span class="step-number">0${i+1}</span><div><h4>${v[0]}</h4><p>${v[1]}</p></div></div>`).join('')}</div></section><section class="surface panel"><div class="eyebrow">CONTAGIOUS / SHARE THE USEFUL PART</div><h3>Make the outcome worth passing on.</h3><div class="gap18">${[['Social currency','Help a colleague make a better decision.'],['Triggers','Tie an article to a real planning occasion.'],['Emotion','Confidence and relief, never invented urgency.'],['Public','Share verified, redacted outcomes by choice.'],['Practical value','Give a checklist, answer or reusable brief.'],['Stories','Show the problem, action and evidenced outcome.']].map(v=>`<div class="activity-row"><span class="activity-icon">${ic('check',12)}</span><div><h4 style="font-size:11px">${v[0]}</h4><p>${v[1]}</p></div></div>`).join('')}</div></section></div><section class="surface panel gap18"><div class="section-head"><h3>Quiet hierarchy. Operational depth.</h3><span class="mono muted">ORIGINAL DESIGN / NOT AFFILIATED</span></div><p style="font-size:12px;line-height:1.8">Apple-inspired restraint: generous space, plain language, clear hierarchy and proportional feedback. Palantir-inspired operational detail: linked objects, contextual inspectors, precise states and evidence beside the action. This is an original interface, not an Apple or Palantir product.</p><div class="sources gap18"><a href="https://www.nirandfar.com/hooked-for-the-enterprise/" target="_blank" rel="noopener noreferrer">Nir Eyal / Hooked for the Enterprise</a><a href="https://jonahberger.com/how-to-trigger-word-of-mouth/" target="_blank" rel="noopener noreferrer">Jonah Berger / STEPPS and word of mouth</a><a href="https://developer.apple.com/design/human-interface-guidelines/design-principles/" target="_blank" rel="noopener noreferrer">Apple / Human Interface Guidelines</a><a href="https://www.palantir.com/docs/foundry/workshop/application-design-best-practices" target="_blank" rel="noopener noreferrer">Palantir / Application design best practices</a></div></section>`;}

function renderDrawer(initial=false){if(!ui.drawer)return;const {type,id,tab}=ui.drawer;let title='',sub='',body='',footer='';if(type==='agent'){const r=S.roles.find(x=>x.id===id);if(!r)return;title=r.name;sub=r.id+' / '+r.group+' / Claude Code role';body=`<div class="row between">${badge(r.state,statusType(r.state))}<span class="mono muted">ROLE DEFINITION / V1.0 DEMO</span></div><p class="gap18" style="font-size:13px;line-height:1.8">${r.desc}</p><div class="divider"></div><h4>Operating contract</h4><dl>${kv('Trigger',r.schedule)}${kv('Execution','Bounded local Claude Code worker')}${kv('Asset scope',r.group==='Response'?'Assigned customer threads':'Registered WorkSocial assets')}${kv('Authority','Current owner-granted capabilities')}${kv('Output','Typed result + redacted evidence')}${kv('Independent review',r.id==='A25'?'Cannot review its own authorship':'A25 before permitted release')}</dl><div class="divider"></div><h4>What this role cannot do</h4><div class="notice gap12">${ic('lock')}<span>Expand permissions, read credential material, invent business facts or bypass failed validation.</span></div><div class="divider"></div><h4>Latest sample outcome</h4><div class="evidence-box gap12">role_id: ${r.id}\nstatus: ${r.state.toUpperCase()}\nsource: illustrative fixture\nexternal_effects: NONE\nartifact_path: runs/DEMO-${r.id}/manifest.json</div><div class="gap18">${button('Export role contract','export-role','','download','data-id="'+id+'"')}</div>`;footer=`<small>${r.runs} illustrative runs &middot; not live activity</small><div class="row">${button(r.state==='Paused'?'Enable role':'Pause role','toggle-role','','pause','data-id="'+id+'"')}${button('Run in demo','run-role','primary','play','data-id="'+id+'"')}</div>`;
}else if(type==='page'){const p=S.pages.find(x=>x.id===id);if(!p)return;title=p.name;sub='worksocial.works'+p.path+' / illustrative audit';body=tabs('page-drawer',[['overview','Overview'],['search','Search & answers'],['change','Propose change'],['evidence','Evidence']],tab);if(tab==='overview'){body+=`<div class="row between">${badge(p.state,statusType(p.state))}${score(p.score)}</div><div class="divider"></div><h4>Source and customer journey</h4><dl>${kv('Editable binding',p.bound?'Demo binding / requires live verification':'Unbound / writes prohibited')}${kv('Page purpose',p.type)}${kv('Source revision','DEMO-REV-001')}${kv('Booking handoff','Not verified against live inventory')}${kv('Commercial facts',p.id==='p1'?'Capacity conflict - release protected':'See approved knowledge')}</dl><div class="divider"></div><h4>Suggested next action</h4><p class="gap12" style="font-size:12px;line-height:1.8">${p.id==='p1'?'Resolve the source conflict before repeating a room-capacity claim. Metadata and answer proposals can be prepared without inventing that fact.':p.id==='p9'?'Follow a controlled form submission into the CRM and notification path. A visible thank-you message is insufficient.':!p.bound?'Verify which CMS item or repository controls the live page. Observation can continue while writes remain blocked.':'Review intent coverage, useful answers, structured data and the next step toward an inquiry.'}</p>${p.id==='p1'?`<div class="gap18">${button('Resolve source conflict','fact','','book','data-id="f1"')}</div>`:''}`;}else if(tab==='search'){body+=`<div class="stack">${[['Technical SEO','Canonical, crawlability and rendered content','No live crawler executed'],['AEO','Direct, verified answers to buying questions','No invented rates or capacity'],['GEO','Clear facts and sourceable useful content','No guaranteed AI inclusion'],['Schema','Entities agree with publicly visible facts','JSON-LD validation required'],['Conversion','Working next step and tracked handoff','CRM receipt proves delivery']].map(v=>`<div class="step-box"><span class="step-number">${ic('check',12)}</span><div><h4>${v[0]}</h4><p>${v[1]}</p><p class="mono">${v[2]}</p></div></div>`).join('')}</div>`;}else if(tab==='change'){body+=`${!p.bound?note('This page is not bound to an editable source. Save a draft if useful, but a release remains blocked.','amber'):''}<div class="field gap18"><label for="page-title-proposal">Proposed page title</label><input id="page-title-proposal" value="${esc(p.proposedTitle||p.name+' | WorkSocial')}"></div><div class="field"><label for="page-description-proposal">Proposed description</label><textarea id="page-description-proposal">${esc(p.proposedDesc||'Explore '+p.name.toLowerCase()+' with WorkSocial. Share your needs with the team to confirm current options and availability.')}</textarea></div><div class="field"><label for="page-change-reason">Reason for the change</label><textarea id="page-change-reason" style="min-height:70px">Clarify the page purpose and next step without adding unsupported business claims.</textarea></div>${note('Saving creates a reviewable proposal. It does not modify the website.','','shield')}<div id="page-error" class="form-error"></div><div class="gap18">${button('Save proposal','save-page-proposal','primary','check','data-id="'+id+'"')}</div>`;}else{body+=`<div class="evidence-box">asset_id: ${p.id}\nurl_path: ${p.path}\nsource_binding: ${p.bound?'DEMO-CMS-MAPPING':'UNBOUND'}\nrevision: DEMO-REV-001\naudit_origin: synthetic design fixture\nlive_crawl: NOT_PERFORMED\nexternal_effects: NONE</div><div class="divider"></div><h4>Linked records</h4><div class="row wrap gap18">${button('Business facts','go-knowledge','','book')}${button('Journey coverage','go-tests','','activity')}</div>`;}footer=`<small>Source-aware changes. Never blind overwrite.</small>${button('Audit this page','audit-single','primary','play','data-id="'+id+'"')}`;
}else if(type==='signal'){const d=SIGNALS.find(x=>x.id===id);title=d.name;sub='Demand signal / sample observation';body=`<div class="row between">${badge(d.evidence,d.evidence==='Hypothesis'?'amber':'green')}<span class="mono muted">${d.id.toUpperCase()} / US / ENGLISH</span></div><h3 class="gap18" style="font-size:24px">${d.delta} <span style="font-size:12px;font-weight:400;color:var(--muted)">${d.sample}</span></h3><div class="gap18">${spark(d.trend,true)}</div><div class="chart-labels"><span>OCT 18</span><span>NOV 14 / ILLUSTRATIVE</span></div><div class="divider"></div><h4>Question worth answering</h4><h3 class="gap12" style="font-size:19px;line-height:1.5">${d.question}</h3><dl>${kv('Source',d.source)}${kv('Intent',d.intent)}${kv('Mapped asset',d.page)}${kv('Comparison','Illustrative matched 28-day window')}${kv('Live evidence','Not connected')}</dl>${note(d.evidence==='Hypothesis'?'This is an editorial idea, not a verified trend. Obtain evidence before presenting it as demand.':'The chart demonstrates evidence presentation. These numbers were not collected from your accounts.','amber')}`;footer=`<small>From evidence to a useful answer.</small>${button('Create content brief','brief-signal','primary','plus','data-id="'+id+'"')}`;
}else if(type==='mission'){const m=S.missions.find(x=>x.id===id);title=m.name;sub=m.id.toUpperCase()+' / '+m.scope;body=`<div class="row between">${badge(m.state,statusType(m.state))}<span class="mono muted">${m.progress}%</span></div><div class="gap18">${progress(m.progress)}</div><div class="row wrap gap18">${m.roles.map(r=>`<button class="pill" data-action="agent" data-id="${r}">${r} ${S.roles.find(x=>x.id===r)?.name.split(' ')[0]||''}</button>`).join('')}</div><div class="divider"></div><h4>Execution evidence</h4><ul class="timeline gap18">${m.steps.map((s,i)=>`<li><span class="timeline-point ${m.progress>=(i+1)*25?'done':''}">${ic(m.progress>=(i+1)*25?'check':'clock',12)}</span><div><h4>${esc(s)}</h4><p>${m.progress>=(i+1)*25?'Recorded in the demo run manifest':'Pending, blocked or not performed'}</p></div></li>`).join('')}</ul><div class="divider"></div>${note('This mission is simulated inside the browser. No Claude process, website change or account action is started.')}<div class="evidence-box gap18">workflow: ${m.id}\nroles: ${m.roles.join(', ')}\npolicy: DEMO-STANDING-V1\nexternal_effects: NONE</div>`;footer=`<small>Local state persists in this browser.</small><div class="row">${button('Export manifest','export-mission','','download','data-id="'+id+'"')}${!['Complete','Cancelled'].includes(m.state)?button(m.state==='Paused'?'Resume':'Pause','pause-mission','primary','pause','data-id="'+id+'"'):''}</div>`;
}else if(type==='incident'){const i=S.incidents.find(x=>x.id===id);title=i.title;sub=i.id.toUpperCase()+' / '+i.asset;body=`<div class="row between">${badge(i.state,i.state==='Resolved'?'green':i.severity==='critical'?'red':'amber')}<span class="mono muted">${i.severity.toUpperCase()}</span></div><p class="gap18" style="font-size:13px;line-height:1.8">${i.desc}</p><div class="divider"></div><h4>Impact and containment</h4><dl>${kv('Business impact',i.kind==='crm'?'An inquiry may not reach the team':i.kind==='fact'?'Unsupported public claim prevented':'One channel cannot publish')}${kv('Current containment',i.kind==='crm'?'No blind event replay':i.kind==='fact'?'Capacity claim blocked':'Affected variant held')}${kv('Evidence type','Synthetic design scenario')}${kv('Authoritative live verification','Not performed')}</dl><div class="divider"></div><h4>Next safe action</h4><p class="gap12" style="font-size:12px;line-height:1.8">${i.kind==='crm'?'Reproduce the controlled failure, inspect the exact field mapping and stage a bounded correction. Re-run the original journey after release.':i.kind==='fact'?'Ask the fact owner for a verified configuration and source. Do not choose a number because it appears more often.':'Reauthorize the correct organization, test granted capabilities and reconcile any uncertain prior post before retrying.'}</p><div class="evidence-box gap18">incident: ${i.id}\nsource: DEMO-SEED\nprivate_customer_data: NONE\nmax_repair_attempts: 2\nlive_effects: NONE</div>`;footer=`<small>Resolve with evidence, not a dismissal.</small>${i.state==='Resolved'?button('View activity','activity','','history'):button(i.kind==='crm'?'Prepare safe repair':i.kind==='fact'?'Review fact':'Reconnect demo account',i.kind==='crm'?'prepare-repair':i.kind==='fact'?'fact':'connect-flow','primary','arrow','data-id="'+(i.kind==='fact'?'f1':i.kind==='auth'?'linkedin':id)+'"')}`;

function renderPalette(initial=false){const app=document.querySelector('.app');if(app)app.inert=true;const q=ui.palette.toLowerCase();const options=[...NAV.flatMap(g=>g[1]).map(n=>({name:n[1],icon:n[2],action:'navigate',id:n[0],kind:'SCREEN'})),{name:'Launch a new mission',icon:'command',action:'new-mission',kind:'ACTION'},{name:'Run a form-to-CRM test',icon:'activity',action:'run-test',kind:'ACTION'},{name:'Stop all outbound writes',icon:'stop',action:'emergency',kind:'CONTROL'},{name:'Preview workspace setup',icon:'laptop',action:'setup',kind:'SETUP'},{name:'Download operations brief',icon:'file',action:'download-brief',kind:'EXPORT'}].filter(o=>o.name.toLowerCase().includes(q));let root=document.getElementById('modal-root');root.innerHTML=`<div class="overlay" data-overlay="true"><section class="dialog palette" role="dialog" aria-modal="true" aria-label="Command palette"><div class="palette-search">${ic('search',19)}<input id="palette-search" value="${esc(ui.palette)}" placeholder="Find a screen or run a command..." aria-label="Search commands"><button class="icon-btn" data-action="close-overlay" aria-label="Close command palette">${ic('close',16)}</button></div><div class="palette-body">${options.map(o=>`<button class="palette-item" data-action="${o.action}" ${o.id?'data-id="'+o.id+'"':''}>${ic(o.icon,17)}${o.name}<small>${o.kind}</small></button>`).join('')||'<div class="empty"><h3>No matching command</h3><p>Try a screen name or workflow.</p></div>'}</div><div class="palette-footer">Tab to select &middot; Enter to open &middot; Escape to close</div></section></div>`;document.body.classList.add('modal-open');if(initial){setTimeout(()=>document.getElementById('palette-search')?.focus(),20);}else{const p=document.getElementById('palette-search');p?.focus();p?.setSelectionRange(ui.palette.length,ui.palette.length);}}

function missionPlan(type){const plans={visibility:{roles:['A03','A07','A08','A10','A25'],tasks:[['Inspect intent & evidence','Map the question to the actual asset.'],['Draft page improvements','Use only approved business facts.'],['Prepare answer coverage','Keep unsupported claims blocked.'],['Validate structured data','Match the visible page and entity record.'],['Review the exact revision','Stage a release only within authority.']]},content:{roles:['A12','A13','A14','A15','A16'],tasks:[['Build the source-linked brief','One useful question and a clear audience.'],['Write the canonical article','Original practical guidance, not duplication.'],['Adapt channel expressions','Use approved real media and formats.'],['Verify the owned-site release','Dependent variants wait for its URL.'],['Collect destination receipts','Partial success remains visible.']]},reliability:{roles:['A19','A20','A21','A22','A25'],tasks:[['Check service health','Reproduce the reported failure.'],['Follow the customer path','Use user-facing browser assertions.'],['Submit a controlled canary','No real payments or inventory effects.'],['Reconcile the CRM receipt','Correct record, mapping and owner.'],['Review recovery evidence','Repeat the original failing journey.']]},support:{roles:['A26','A27','A28','A29','A25'],tasks:[['Classify the inquiry','Acquire conversation ownership.'],['Retrieve current facts','Unknown price or availability stays unknown.'],['Qualify the customer need','Ask only necessary questions.'],['Prepare the human handoff','No unverified appointment promise.'],['Check authority before send','Human takeover cancels stale responses.']]}};return plans[type]||plans.visibility;}

function newMission(type='visibility'){ui.missionForm={type,scope:type==='support'?'Eligible inbound conversations':type==='reliability'?'Contact form to Zoho sandbox':type==='content'?'Owned website & eligible channels':'Menlo Park training-room page',name:({visibility:'Improve training-room visibility and qualified inquiries',content:'Create and distribute a practical training-day guide',reliability:'Verify the complete inquiry-to-CRM journey',support:'Qualify after-hours inquiries and prepare useful handoffs'})[type]||'Improve WorkSocial visibility'};openDialog('mission');}
function startMission(){if(!document.getElementById('mission-confirm')?.checked){err('mission-error','Confirm this is a simulated run before launching.');return;}if(!canAct('read'))return;if(S.paused){err('mission-error','New work is paused. Resume operations before launching.');return;}const plan=missionPlan(ui.missionForm.type);const id='m'+Date.now();const m={id,name:ui.missionForm.name,scope:ui.missionForm.scope,state:'Running',progress:0,roles:plan.roles,steps:plan.tasks.map(t=>t[0]),demo:true};S.missions.unshift(m);addActivity('Demo mission launched',m.name+' / no external effects','command');closeOverlay();navigate('missions');toast('Demo mission started','Inspect its timeline as the sample stages complete.');advanceMission(id);}
function advanceMission(id){const tick=()=>{const m=S.missions.find(m=>m.id===id);if(!m||m.state==='Cancelled'||m.state==='Complete')return;if(m.state==='Paused'||!S.hostOnline||S.paused){timers.push(setTimeout(tick,1100));return;}m.progress=Math.min(100,m.progress+20);if(m.progress===100){m.state='Complete';addActivity('Demo mission completed',m.name+' / source-bound sample output','checkcircle');toast('Demo mission completed','The manifest records simulated outputs only.');}persist();if(ui.drawer?.type==='mission'&&ui.drawer.id===id)renderDrawer();else refresh();if(m.progress<100)timers.push(setTimeout(tick,1000));};timers.push(setTimeout(tick,700));}
function startTest(){if(!canAct('read'))return;if(ui.testRunning){toast('A test is already running');return;}ui.testScenario=val('test-scenario')||'healthy';closeOverlay();navigate('tests');ui.testsTab='journeys';ui.testRunning=true;ui.testStep=0;ui.testFailure=false;render();const scenario=ui.testScenario;const runId='DEMO-JOURNEY-'+Date.now();function step(){if(!S.hostOnline){finish('Blocked - host offline',null);return;}if(scenario==='expired'&&ui.testStep===2){ui.testFailure=true;finish('Failed - authentication',null);return;}if(scenario==='missing'&&ui.testStep===3){ui.testFailure=true;finish('Failed - CRM receipt',null);return;}if(ui.testStep===5){finish('Passed','DEMO-ZOHO-'+runId.slice(-6));return;}ui.testStep++;if(S.route==='tests'&&!ui.dialog&&!ui.drawer)render();timers.push(setTimeout(step,600));}function finish(result,receipt){ui.testRunning=false;S.testRuns.unshift({id:runId,scenario,result,receipt,at:new Date().toISOString(),synthetic:true,real_submissions:0,duplicates_suppressed:scenario==='duplicate'?1:0,steps:[{name:'Page render',passed:true},{name:'Durable form acceptance',passed:true},{name:'Integration authentication',passed:scenario!=='expired'},{name:'Exactly one CRM record',passed:!!receipt},{name:'Controlled notification',passed:!!receipt}]});addActivity('Synthetic journey: '+result,runId+' / no actual submission','activity');refresh();toast(result,receipt?'Synthetic CRM receipt: '+receipt:'The precise failure is preserved in the trace.',!receipt);}timers.push(setTimeout(step,600));}
function preparePublish(id){ui.selectedCampaign=id||ui.selectedCampaign;if(S.editorDrafts?.[ui.selectedCampaign]){toast('Save the edited draft first','The release must use the reviewed exact revision.',true);return;}openDialog('publish',{id:ui.selectedCampaign});}
function confirmPublish(){const id=val('publish-campaign');const c=S.campaigns.find(x=>x.id===id);if(!c)return;if(!document.getElementById('publish-confirm')?.checked){err('publish-error','Confirm the demo transaction first.');return;}if(c.quality!=='Passed'){err('publish-error','This revision needs review. Save it and run the demo quality check in the editor.');return;}if(!canAct())return;if(!S.settings.standingPublish){err('publish-error','Routine publication is disabled in standing permissions.');return;}let ids=[...document.querySelectorAll('.publish-channel:checked')].map(e=>e.value);ids=ids.filter(id=>S.connections.find(c=>c.id===id)?.state==='Ready');if(!ids.length){err('publish-error','Select at least one eligible destination.');return;}if(ids.some(x=>x!=='cms')&&!ids.includes('cms')&&!S.publications.some(p=>p.campaignId===c.id&&p.version===c.version&&p.connector==='cms'&&/Verified/.test(p.state))){err('publish-error','Publish and verify this canonical article first, or include the Website destination.');return;}const time=val('publish-time'),scenario=val('publish-scenario'),date=val('publish-date');if(time==='scheduled'&&!date){err('publish-error','Choose a scheduled time.');return;}let newItems=[];for(const id of ids){if(S.publications.some(p=>p.campaignId===c.id&&p.version===c.version&&p.connector===id&& !/Rate limited/.test(p.state))){continue;}const cn=S.connections.find(c=>c.id===id);const p={id:'pub'+Date.now()+'-'+id,campaignId:c.id,title:c.title,channel:cn.name,connector:id,state:time==='scheduled'?'Scheduled (demo)':'Accepted (demo)',ref:'Awaiting demo read-back',time:time==='scheduled'?date.replace('T',' '):'Just now',version:c.version,scenario};S.publications.unshift(p);newItems.push(p);}if(!newItems.length){err('publish-error','This exact revision already has a job for the selected destinations. Inspect the ledger instead of duplicating it.');return;}c.state=time==='scheduled'?'Scheduled (demo)':'Releasing (demo)';addActivity('Demo release prepared',newItems.length+' destination(s) / '+c.title,'send');closeOverlay();navigate('distribution');toast(time==='scheduled'?'Scheduled demo jobs saved':'Release simulation started',time==='scheduled'?'This HTML will not publish later or run in the background.':'Each destination is verified independently.');if(time==='scheduled')return;newItems.forEach((p,i)=>timers.push(setTimeout(()=>{const conn=S.connections.find(c=>c.id===p.connector);if(!S.hostOnline||S.outboundStopped||S.mode!=='operate'||!S.settings.standingPublish||conn?.state!=='Ready'){p.state='Blocked by current policy';p.ref='No verified provider receipt';}else if(p.connector!=='cms'&&!S.publications.some(x=>x.campaignId===c.id&&x.version===c.version&&x.connector==='cms'&&/Verified/.test(x.state))){p.state='Waiting for canonical';p.ref='Dependency not verified';}else if(scenario==='unknown'){p.state='Unknown outcome';p.ref='DEMO-ACK-UNCERTAIN';}else if(scenario==='rate'){p.state='Rate limited';p.ref='No write / DEMO-429';}else{p.state='Verified (demo)';p.ref='DEMO-'+p.connector.toUpperCase()+'-'+String(Date.now()).slice(-5);}if(i===newItems.length-1)c.state=newItems.every(x=>/Verified/.test(x.state))?'Published (demo)':'Needs attention';persist();refresh();if(ui.drawer?.type==='publication'&&ui.drawer.id===p.id)renderDrawer();if(i===newItems.length-1){addActivity('Demo release results recorded',newItems.map(x=>x.channel+': '+x.state).join(' / '),'send');toast('Destination outcomes recorded','Inspect the ledger for partial or uncertain results.');}},900+i*700)));}
function runSearch(query){ui.searchQuery=query;let q=query.toLowerCase();const n=q.match(/\b(\d{1,3})\b/);const people=n?Number(n[1]):null;const category=/train|classroom|workshop/.test(q)?'Training':/office/.test(q)?'Office':/meeting|conference/.test(q)?'Meeting':null;let location=/new york|manhattan|nyc/.test(q)?'New York':/los angeles/.test(q)?'Los Angeles':/jersey/.test(q)?'Jersey City':null;const display=/display|screen|projector/.test(q);const video=/video/.test(q);const unknownConstraint=/accessible|wheelchair|parking|cater|pool|beach|hotel|bed|recording|podcast/.test(q);ui.searchFilters={...(people?{people}:{}),...(category?{type:category}:{}),...(location?{location}:{}),...(display?{display:'required'}:{}),...(video?{video:'required'}:{}),...(unknownConstraint?{unverified:'unsupported constraint'}:{}),availability:'unknown'};ui.searchResults=unknownConstraint?[]:CATALOG.filter(r=>(!people||r.capacity>=people)&&(!category||r.type===category)&&(!location||r.location===location)&&(!display||r.amenities.includes('Display'))&&(!video||r.amenities.includes('Video conferencing')));addActivity('Demo semantic query evaluated',query+' / sample catalog only','search');render();}

function simulateQueuedReply(){const t=S.threads.find(t=>t.id===ui.selectedThread);if(!canAct())return;if(S.repliesPaused||!S.settings.standingReplies||t.owner==='Human'){toast('Agent reply is not permitted','Review thread ownership and reply policy.',true);return;}t.version=(t.version||0)+1;const version=t.version;t.queued=true;addActivity('Demo agent reply queued',t.id+' / takeover will invalidate this send','message');closeOverlay();navigate('inbox');toast('Demo reply queued for this thread','Take over now to demonstrate cancellation.');timers.push(setTimeout(()=>{if(t.owner!=='Agent'||t.version!==version||S.repliesPaused||S.outboundStopped||!S.hostOnline||S.mode!=='operate'||!S.settings.standingReplies){t.queued=false;addActivity('Queued demo reply cancelled',t.id+' / ownership or authority changed','lock');refresh();toast('Queued reply was cancelled','The send-time ownership check prevented it.');return;}t.messages.push({from:'agent',text:t.reply,time:'Now'});t.queued=false;t.status='Answered';addActivity('Supported demo reply recorded',t.id+' / no real message sent','message');refresh();},4500));}

etic/de-identified inputs. I understand these are simulated API results.')}<div class="row between gap18"><small class="muted">Fixture run estimate: $0.24 / no real cost</small>${xb(xu.evalBusy?'Running...':'Run evaluation','eval-run','primary','play')}</div>${xu.evalBusy?`<div class="gap18">${progress(xu.evalProgress)}${xb('Cancel remaining cases','eval-cancel','small','stop')}</div>`:''}</section><section class="surface panel"><span class="eyebrow">READINESS & GRADING</span><h3 class="gap8">Evidence before a score.</h3><div class="x-gates">${['claudeapi','gemini'].map(id=>`<div>${ic(providerReady(id)?'checkcircle':'plug',17)}<span>${id==='claudeapi'?'Claude API':'Gemini API'}</span>${providerReady(id)?badge('Test ready','green'):xb('Configure','connect','small','plug',id)}</div>`).join('')}<div>${ic('lock',17)}<span>Production actions</span>${badge('Never granted')}</div></div><div class="x-process-vertical"><div><b>Deterministic</b><span>Schema, critical facts, hard constraints, source support</span></div><div><b>Independent judgment</b><span>Utility and clarity; blinded grading where feasible</span></div><div><b>Human adjudication</b><span>Resolve disagreements; no automatic majority vote</span></div><div><b>Result states</b><span>Pass / fail / refusal / error / not run / cancelled</span></div></div>${note('Record model ID, API version, prompt hash, evidence revision, tools, repetition, latency and usage for every case.')}</section></div>${last?`<section class="surface panel gap18"><div class="section-head"><div><span class="eyebrow">${last.id} / ${last.mode==='fixed'?'FIXED CORPUS':'OPEN WEB'}</span><h3>Case-level results</h3></div>${badge(last.state,last.state==='Complete'?'green':'amber')}</div><div class="table-wrap"><table class="table"><thead><tr><th>Case</th><th>Claude API</th><th>Gemini API</th><th>Outcome</th><th></th></tr></thead><tbody>${last.cases.map((c,i)=>`<tr><td><b>${c.name}</b><small>${c.condition}</small></td><td>${badge(c.claude,c.claude==='P  if(n===1){for(const f of ['x-root','x-content-root','x-evidence-root'])if(!isAbsolutePath(val(f))){toast('Use valid absolute planned paths','Parent-directory traversal is not allowed.',true);return;}S.settings.workspace=val('x-root');S.settings.content=val('x-content-root');S.settings.evidence=val('x-evidence-root');q.folders=true;}

 if(n===3){if(!document.getElementById('x-facts-consent')?.checked){toast('Confirm the approved-facts boundary','',true);return;}q.facts=true;}
 if(n===5){if(!document.getElementById('x-canary-consent')?.checked){toast('Confirm controlled test-data rules','',true);return;}q.journey=true;}
 if(n===6){if(![0,1,2,3,4,5].every(stepDone)){toast('Readiness gates are incomplete','Finish the required configuration before rehearsal.',true);return;}if(!canAct('read'))return;q.dry=true;}
 if(n===7){const cap=Number(val('x-launch-cap'));if(![0,1,2,3,4,5,6].every(stepDone)||!document.getElementById('x-launch-consent')?.checked||!Number.isFinite(cap)||cap<1||cap>500){toast('Pilot cannot be enabled','Complete all gates, confirm simulation and choose a cap from $1 to $500.',true);return;}q.enabled=true;S.x.policies.cadence=val('x-cadence');S.x.policies.cap=cap;S.mode='observe';}
 xevent('Activation gate completed',ACTIVATION_STEPS[n][0]+' / fixture only');render();toast(n===7?'Read-and-draft pilot enabled in preview':'Sample check passed',n===7?'No real schedule or external activity was created.':'Inspect the recorded scope before continuing.');break;}

 case 'chart-data':simpleDialog('Underlying illustrative trend',`<div class="table-wrap"><table class="table"><thead><tr><th>Point</th><th>Fixture index</th></tr></thead><tbody>${RANGE_FIXTURES[xu.range].points.map((n,i)=>`<tr><td>${i+1}</td><td>${n}</td></tr>`).join('')}</tbody></table></div>`,button('Close','close-overlay'),'DATA / NOT LIVE');break;

 case 'policy-save':{const cap=Number(val('x-policy-cap')),ec=Number(val('x-policy-eval')),slots=Number(val('x-policy-slots'));if(!Number.isFinite(cap)||cap<1||cap>500||!Number.isFinite(ec)||ec<=0||ec>100||!Number.isInteger(slots)||slots<1||slots>8){toast('Use bounded resource values','Operational $1-500; evaluation $0.01-100; 1-8 slots.',true);return;}Object.assign(S.x.policies,{cap,evalCap:ec,concurrency:slots});S.settings.budget=cap;S.settings.concurrency=slots;S.x.policies.version++;xevent('Resource limits saved','No real provider spending changed');render();toast('Limits saved in prototype');break;}

function startEvaluation(){if(xu.evalBusy)return;if(!canAct('read'))return;const providers=val('x-eval-provider'),needed=providers==='both'?['claudeapi','gemini']:[providers];if(needed.some(id=>!providerReady(id))){toast('Configure the selected test providers','A working CLI is not proof of API access.',true);return;}const cap=Number(val('x-eval-cap'));if(!Number.isFinite(cap)||cap<.24||cap>S.x.policies.evalCap||!document.getElementById('x-eval-consent')?.checked){toast('Evaluation authorization incomplete','Confirm synthetic input and a cap of at least $0.24 within the policy limit.',true);return;}const mode=xu.evalMode,scenario=val('x-eval-outcome'),count=Number(val('x-eval-count'));xu.evalBusy=true;xu.evalProgress=10;render();const token=Date.now();xu.evalToken=token;let tick=0;const timer=setInterval(()=>{if(!xu.evalBusy||xu.evalToken!==token||!S.hostOnline){clearInterval(timer);if(!S.hostOnline){xu.evalBusy=false;refresh();}return;}tick++;xu.evalProgress=Math.min(100,tick*25);if(tick===4){clearInterval(timer);xu.evalBusy=false;const names=['Hourly booking question','Unknown room availability','Capacity hard constraint','Amenity claim support','Privacy and escalation','No eligible inventory'];const cases=Array.from({length:count},(_,i)=>({name:names[i%names.length]+(count>6?' / trial '+(Math.floor(i/6)+1):''),condition:mode==='fixed'?'Approved facts v2 / fixed corpus':'Open-web fixture / timestamped observation',claude:providers==='gemini'?'Not selected':'Pass',gemini:providers==='claudeapi'?'Not selected':scenario==='rate'?'Provider error':i%6===3?'Disagreement':'Pass',verdict:scenario==='rate'&&providers!=='claudeapi'?'Incomplete provider evidence':i%6===3&&providers!=='claudeapi'?'Human adjudication required':'Deterministic constraints passed'}));S.x.evalRuns.unshift({id:'DEMO-EVAL-'+(S.x.evalRuns.length+1),at:new Date().toISOString(),mode,providers,count,state:scenario==='rate'?'Partial / provider error':'Complete',cases,actualExternalCost:0,fixtureEstimate:.24});xevent('Evaluation fixture completed',mode+' / no model requests sent');}refresh();},230);timers.push(timer);}
