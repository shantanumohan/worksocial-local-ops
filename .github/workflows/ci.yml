name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implemented-suites:
    name: check · unit · contract · e2e-lite · soak evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack / pnpm (packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          node -v
          pnpm -v

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit
        run: pnpm test:unit

      - name: Contract
        run: pnpm test:contract

      - name: E2E lite (fixture; not browser acceptance)
        run: pnpm test:e2e

      - name: Soak recovery rehearsal (fixture)
        run: pnpm recovery:rehearse

      - name: Acceptance evidence compiler (fixture)
        run: pnpm release:evidence

      - name: Validate acceptance matrix ↔ catalog (+ ACCEPTED evidence)
        run: pnpm test:acceptance-matrix

      - name: Eval isolation suite (AA-20 offline; not live fleet / not catalog VERIFIED)
        run: pnpm test:eval

      - name: Security gate suite (ownership / auth / lease; not pen-test / not catalog VERIFIED)
        run: pnpm test:security

  database-durable:
    name: postgres durable execution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: worksocial
          POSTGRES_PASSWORD: worksocial
          POSTGRES_DB: worksocial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worksocial -d worksocial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://worksocial:worksocial@localhost:5432/worksocial_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack / pnpm (packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm db:migrate

      - name: Database suite (restart + uniqueness races)
        run: pnpm test:database

      - name: Workflow suite (LOCAL_DURABLE + Temporal local test-server crash/restart)
        run: pnpm test:workflow

  temporal-compose:
    name: temporal compose e2e (API → Temporal → PG)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: worksocial
          POSTGRES_PASSWORD: worksocial
          POSTGRES_DB: worksocial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worksocial -d worksocial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://worksocial:worksocial@localhost:5432/worksocial_test
      TEMPORAL_ADDRESS: 127.0.0.1:7233
      TEMPORAL_NAMESPACE: default
      WORKSOCIAL_TEMPORAL_COMPOSE_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack / pnpm (packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Migrate app Postgres
        run: pnpm db:migrate

      - name: Start Temporal auto-setup (compose)
        run: docker compose -f deploy/temporal/docker-compose.yml up -d

      - name: Build (needed before Temporal wait / e2e)
        run: pnpm build:local

      - name: Wait for Temporal frontend + namespace (SDK)
        working-directory: services/workflow-worker
        run: |
          set -e
          # Script lives in this package (declares @temporalio/client) so pnpm
          # resolution succeeds. Dials frontend AND describeNamespace.
          if ! pnpm run wait:temporal; then
            echo "::error::Temporal frontend/namespace not ready at ${TEMPORAL_ADDRESS} ns=${TEMPORAL_NAMESPACE}"
            docker compose -f ../../deploy/temporal/docker-compose.yml ps || true
            docker compose -f ../../deploy/temporal/docker-compose.yml logs || true
            exit 1
          fi

      - name: Compose e2e (API → Temporal → PG)
        run: pnpm test:temporal-compose

  # test:eval + test:security are implemented offline suites and required above
  # (fixture isolation / auth-ownership gates — not live fleet, pen-test, or catalog VERIFIED).
  # recovery:rehearse + release:evidence are implemented for M9 and required above.
  # test:database and test:workflow are implemented for M2 and required above.
  # test:temporal-compose is required via the temporal-compose job (Docker auto-setup).
