name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implemented-suites:
    name: check · unit · contract · e2e-lite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack / pnpm (packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          node -v
          pnpm -v

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Validate acceptance matrix ↔ catalog
        run: pnpm test:acceptance-matrix

      - name: Typecheck
        run: pnpm check

      - name: Unit
        run: pnpm test:unit

      - name: Contract
        run: pnpm test:contract

      - name: E2E lite (fixture; not browser acceptance)
        run: pnpm test:e2e

      - name: Assert placeholder suites cannot pass release gates
        run: |
          set +e
          failed=0
          for suite in test:security test:eval recovery:rehearse release:evidence; do
            echo "::group::stub $suite (must exit non-zero)"
            pnpm "$suite"
            code=$?
            echo "exit=$code"
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then
              echo "::error::Stub suite $suite exited 0 — placeholders must not satisfy required checks"
              failed=1
            fi
          done
          exit $failed

  database-durable:
    name: postgres durable execution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: worksocial
          POSTGRES_PASSWORD: worksocial
          POSTGRES_DB: worksocial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worksocial -d worksocial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://worksocial:worksocial@localhost:5432/worksocial_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack / pnpm (packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm db:migrate

      - name: Database suite (restart + uniqueness races)
        run: pnpm test:database

      - name: Workflow suite (LOCAL_DURABLE mission + Temporal NOT_WIRED probe)
        run: pnpm test:workflow

  # Stub/incomplete suites (security/eval/recovery/release) are NOT
  # required green checks — they must fail (see assert step above).
  # test:database and test:workflow are implemented for M2 and required above.
